name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to upload assets to
        required: true
        default: v1.2.1

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "."
          python -m unittest discover -s tests -v
          python -m py_compile gui.py archive.py recorder.py

      - name: Build application
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          New-Item -ItemType Directory -Force -Path .tools | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" `
            -OutFile ".tools/yt-dlp.exe"
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "X Space Recorder" `
            --add-binary ".tools/yt-dlp.exe;." `
            gui.py

      - name: Package ZIP
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}" -replace "^v", ""
          $baseName = "X-Space-Recorder-$version-Windows"
          $package = "release/$baseName"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "dist/X Space Recorder.exe" $package
          Copy-Item "配布版の使い方.txt" $package
          Copy-Item README.md, LICENSE, SECURITY.md, THIRD_PARTY_NOTICES.md $package
          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "release/$baseName.zip" `
            -CompressionLevel Optimal `
            -Force
          $hash = Get-FileHash `
            -Algorithm SHA256 `
            -Path "release/$baseName.zip"
          Set-Content `
            -Path "release/$baseName.zip.sha256.txt" `
            -Value "$($hash.Hash)  $baseName.zip" `
            -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: X-Space-Recorder-${{ inputs.tag }}-Windows
          path: |
            release/*.zip
            release/*.zip.sha256.txt

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.tag }}" -replace "^v", ""
          $baseName = "X-Space-Recorder-$version-Windows"
          gh release upload "${{ inputs.tag }}" `
            "release/$baseName.zip" `
            "release/$baseName.zip.sha256.txt" `
            --clobber
